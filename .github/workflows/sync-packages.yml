name: Sync Package Library

on:
  schedule:
    # Run daily at 00:00 UTC as fallback
    - cron: '0 0 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [package-library-updated]

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v6

      # The scenery repository holds library generations (v1/, v2/, ...),
      # each a complete world at its own URL, and keeps the pre-0.5 library
      # at its root, frozen. Every one of them is hosted, so each client
      # finds the library it reads. What the packages page presents is one
      # generation only, named by `sceneryGeneration` in hugo.toml. Its
      # region_metadata.json is written to data/regions.json, and Hugo
      # renders the region table, legend and sizes from it.
      - name: Fetch package libraries and metadata
        run: |
          BASE=https://raw.githubusercontent.com/samsoir/xearthlayer-regional-scenery/main
          LIBRARY=xearthlayer_package_library.txt

          # The frozen root library, read by releases before 0.5.0
          curl -fsSL "$BASE/$LIBRARY" -o "static/packages/$LIBRARY"

          # Every generation folder on main: v1, v2, ...
          GENERATIONS=$(curl -fsSL https://api.github.com/repos/samsoir/xearthlayer-regional-scenery/contents \
            | jq -r '.[] | select(.type == "dir") | .name' | grep -E '^v[1-9][0-9]*$' || true)
          for gen in $GENERATIONS; do
            mkdir -p "static/packages/$gen"
            curl -fsSL "$BASE/$gen/$LIBRARY" -o "static/packages/$gen/$LIBRARY"
            echo "Hosted library generation $gen"
          done

          # The generation the packages page presents. Until it exists on
          # main, the root library stands in for it.
          GEN=$(sed -n 's/^[[:space:]]*sceneryGeneration[[:space:]]*=[[:space:]]*"\(v[1-9][0-9]*\)".*/\1/p' hugo.toml | head -1)
          SOURCE="$BASE/$GEN"
          PAGE_LIBRARY="static/packages/$GEN/$LIBRARY"
          if [ -z "$GEN" ] || [ ! -f "$PAGE_LIBRARY" ]; then
            echo "::notice::Generation '${GEN}' not on main yet; the packages page uses the root library"
            SOURCE="$BASE"
            PAGE_LIBRARY="static/packages/$LIBRARY"
          fi

          # Region metadata (names and coverage descriptions) and the coverage
          # map, both of the presented generation
          mkdir -p data
          curl -fsSL "$SOURCE/region_metadata.json" -o data/regions.json
          mkdir -p static/images
          curl -fsSL "$SOURCE/coverage.png" -o static/images/coverage.png

          # Region shapes for the packages map, dissolved from the per-tile
          # coverage. The source is large and is never committed.
          curl -fsSL "$SOURCE/coverage.geojson" -o "$RUNNER_TEMP/coverage.geojson"
          mkdir -p static/data
          python3 scripts/dissolve-regions.py "$RUNNER_TEMP/coverage.geojson" static/data/regions.geojson

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Files changed:"
            git diff --name-only
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add static/packages static/images/coverage.png data/regions.json static/data/regions.geojson
          git commit -m "chore: sync package library and region data

          Automatically synced from xearthlayer-regional-scenery repository."
          git push

      - name: Trigger deploy
        if: steps.changes.outputs.changed == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy.yml',
              ref: 'main'
            })
