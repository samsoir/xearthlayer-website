<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 470" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Scenery pack order</title>
  <desc id="desc">From highest to lowest priority: custom airports, landmarks and regional scenery; X-Plane Airports and Landmarks; GLOBAL_AIRPORTS; SimHeaven X-World Pro; regional and airport meshes; libraries; yzXEL_overlay; zzXEL_ortho.</desc>
  <style>
    /* Docs neutral palette (dark), Catppuccin accents for highlighted layers */
    .bg { fill: #1d1d20; }
    .row { fill: #1d1d20; stroke: #414147; stroke-width: 1; }
    .label { fill: #d4d4d9; font-size: 13px; font-weight: 500; }
    .note { fill: #a5a5ac; font-size: 11px; }
    .axis { stroke: #6a6a72; stroke-width: 2; }
    .axis-head { fill: #6a6a72; }
    .axis-top { fill: #a5a5ac; font-size: 11px; }
    .axis-bottom { fill: #6a6a72; font-size: 11px; }
    .legend { fill: #a5a5ac; font-size: 12px; }

    .xwp { fill: rgba(166, 227, 161, 0.10); stroke: #a6e3a1; stroke-width: 2; }
    .xwp-label { fill: #a6e3a1; }
    .ovl { fill: rgba(137, 180, 250, 0.12); stroke: #89b4fa; stroke-width: 2; }
    .ovl-label { fill: #89dceb; }
    .ovl-note { fill: #89b4fa; }
    .ort { fill: rgba(203, 166, 247, 0.12); stroke: #cba6f7; stroke-width: 2; }
    .ort-label { fill: #f5c2e7; }
    .ort-note { fill: #cba6f7; }

    @media (prefers-color-scheme: light) {
      .bg { fill: #eff1f5; }
      .row { fill: #eff1f5; stroke: #a5a5ac; }
      .label { fill: #36363c; }
      .note { fill: #5c5c63; }
      .axis { stroke: #737379; }
      .axis-head { fill: #737379; }
      .axis-top { fill: #4b4b52; }
      .axis-bottom { fill: #737379; }
      .legend { fill: #4b4b52; }

      .xwp { fill: rgba(64, 160, 43, 0.10); stroke: #40a02b; }
      .xwp-label { fill: #2f7a20; }
      .ovl { fill: rgba(30, 102, 245, 0.08); stroke: #1e66f5; }
      .ovl-label, .ovl-note { fill: #1e66f5; }
      .ort { fill: rgba(136, 57, 239, 0.08); stroke: #8839ef; }
      .ort-label, .ort-note { fill: #8839ef; }
    }
  </style>

  <rect class="bg" width="590" height="470"/>

  <!-- Priority axis -->
  <g transform="translate(35, 40)">
    <text class="axis-top" x="0" y="-18" text-anchor="middle">Higher</text>
    <text class="axis-top" x="0" y="-5" text-anchor="middle">Priority</text>
    <line class="axis" x1="0" y1="12" x2="0" y2="362"/>
    <polygon class="axis-head" points="-8,12 8,12 0,0"/>
    <text class="axis-bottom" x="0" y="380" text-anchor="middle">Lower</text>
    <text class="axis-bottom" x="0" y="393" text-anchor="middle">Priority</text>
  </g>

  <!-- Layer stack, top loads first and wins -->
  <g transform="translate(70, 25)">
    <g transform="translate(0, 0)">
      <rect class="row" width="490" height="36" rx="6"/>
      <text class="label" x="20" y="23">Custom Airports, Landmarks &amp; Regional Scenery</text>
    </g>

    <g transform="translate(0, 46)">
      <rect class="row" width="490" height="36" rx="6"/>
      <text class="label" x="20" y="23">X-Plane Airports &amp; Landmarks</text>
    </g>

    <g transform="translate(0, 92)">
      <rect class="row" width="490" height="36" rx="6"/>
      <text class="label" x="20" y="23">*GLOBAL_AIRPORTS*</text>
    </g>

    <g transform="translate(0, 138)">
      <rect class="xwp" width="490" height="36" rx="6"/>
      <text class="label xwp-label" x="20" y="23">SimHeaven X-World Pro</text>
      <text class="note" x="245" y="23">(Layers 01 to 13, per continent)</text>
    </g>

    <g transform="translate(0, 184)">
      <rect class="row" width="490" height="36" rx="6"/>
      <text class="label" x="20" y="23">Regional &amp; Airport Meshes</text>
    </g>

    <g transform="translate(0, 230)">
      <rect class="row" width="490" height="36" rx="6"/>
      <text class="label" x="20" y="23">Libraries</text>
      <text class="note" x="245" y="23">(X-World Pro Library and others)</text>
    </g>

    <g transform="translate(0, 276)">
      <rect class="ovl" width="490" height="36" rx="6"/>
      <text class="label ovl-label" x="20" y="23">yzXEL_overlay</text>
      <text class="note ovl-note" x="245" y="23">(Roads, forests, buildings)</text>
    </g>

    <g transform="translate(0, 322)">
      <rect class="ort" width="490" height="36" rx="6"/>
      <text class="label ort-label" x="20" y="23">zzXEL_ortho</text>
      <text class="note ort-note" x="245" y="23">(Satellite imagery)</text>
    </g>
  </g>

  <!-- Legend -->
  <g transform="translate(70, 430)">
    <rect class="row" width="16" height="16" rx="3"/>
    <text class="legend" x="24" y="13">Other scenery</text>

    <rect class="xwp" x="118" width="16" height="16" rx="3"/>
    <text class="legend" x="142" y="13">X-World Pro</text>

    <rect class="ovl" x="230" width="16" height="16" rx="3"/>
    <text class="legend" x="254" y="13">XEarthLayer overlay</text>

    <rect class="ort" x="382" width="16" height="16" rx="3"/>
    <text class="legend" x="406" y="13">XEarthLayer ortho</text>
  </g>
</svg>
